plugins {
	id 'fabric-loom'
}

dependencies {
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"

	// Sodium - compile against it but don't bundle it
	modCompileOnly "maven.modrinth:sodium:${rootProject.sodium_version_fabric}"
	modRuntimeOnly "maven.modrinth:sodium:${rootProject.sodium_version_fabric}"
}

loom {
	// OJO: dentro de loom{} en Loom 1.6, 'rootProject' se resuelve a un Boolean
	// (isRootProject de la extension), NO al Project raiz. Usar rootDir + file().
	accessWidenerPath = file("${rootDir}/common/src/main/resources/sodiumfpsstepfix.accesswidener")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}
